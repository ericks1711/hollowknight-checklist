<!DOCTYPE html>
<html lang="pt-br">

<head>
  <link rel="icon" type="image/png" href="imgs/MascaraGrimm.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hollow CheckList</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/script.js" defer></script>
</head>

<body>
  <header>
    <img src="imgs/MascaraGrimm.png" alt="logo Hollow CheckList" width="80" height="80">
    <div>
      <h1>Hollow CheckList</h1>
      <p id="progresso"></p>
      <!--<nav id="categorias"></nav> botão para ir para mascara, amuletos e tals-->
    </div>
  </header>
  <main id="listas">
    <section> <!--Ferrão-->
      <h2>Ferrão 4%</h2>
      <p id="progresso-ferrao"></p>
      <div id="lista-ferrao" class="grid-itens"></div>
    </section>
    <section> <!--Artes do Ferrão-->
      <h2>Artes do Ferrão 3%</h2>
      <p id="progresso-ferraoArt"></p>
      <div id="lista-ferraoArt" class="grid-itens"></div>
    </section>
    <section> <!--Magias-->
      <h2>Magias 6%</h2>
      <p id="progresso-magias"></p>
      <div id="lista-magias" class="grid-itens"></div>
    </section>
    <section> <!--Ferrão dos Sonhos-->
      <h2>Ferrão dos Sonhos 3%</h2>
      <p id="progresso-ferraoSon"></p>
      <div id="lista-ferraoSon" class="grid-itens"></div>
    </section>
    <section> <!--Amuletos-->
      <h2>Amuletos 40%</h2>
      <p id="progresso-amuletos"></p>
      <div id="imgAmuletos">
        <img src="imgs/OrdemAmuletos.png" alt="Ordem Amuletos">
      </div>
      <div id="lista-amuleto" class="grid-itens"></div>
    </section>
    <section> <!--Chefes-->
      <h2>Chefes 17%</h2>
      <p id="progresso-chefes"></p>
      <div id="lista-chefes" class="grid-itens"></div>
    </section>
    <section> <!--Chefes dos Sonhos-->
      <h2>Chefes dos Sonhos 7%</h2>
      <p id="progresso-chefes-sonhos"></p>
      <div id="lista-chefes-sonhos" class="grid-itens"></div>
    </section>
    <section> <!--Sonhadores-->
      <h2>Sonhadores 3%</h2>
      <p id="progresso-sonhadores"></p>
      <div id="lista-sonhadores" class="grid-itens"></div>
    </section>
    <section> <!--Fragmentos de Máscara-->
      <h2>Fragmentos de Máscara 4%</h2>
      <p id="progresso-mascara"></p>
      <div id="lista-mascara" class="grid-itens"></div>
    </section>
    <section> <!--Fragmentos de Receptáculo-->
      <h2>Fragmentos de Receptáculo 3%</h2>
      <p id="progresso-receptaculo"></p>
      <div id="lista-receptaculo" class="grid-itens"></div>
    </section>
    <section> <!--Habilidades-->
      <h2>Habilidades 12%</h2>
      <p id="progresso-itens"></p>
      <div id="lista-itens" class="grid-itens"></div>
    </section>
    <section> <!--Derivados-->
      <h2>Derivados 3%</h2>
      <p id="progresso-outros"></p>
      <div id="lista-outros" class="grid-itens"></div>
    </section>
    <section> <!--Coliseu dos Tolos-->
      <h2>Coliseu dos Tolos 3%</h2>
      <p id="progresso-coliseu"></p>
      <div id="lista-coliseu" class="grid-itens"></div>
    </section>
    <section> <!--Panteões-->
      <h2>Panteões 3%</h2>
      <p id="progresso-panteoes"></p>
      <div id="lista-panteoes" class="grid-itens"></div>
    </section>
  </main>
  <footer></footer>
</body>

</html>
